[project]
name = "proyectorobot"
version = "0.1.0"
description = "Visión e imitación para un robot virtual, con ejecución local en CPU"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-phase1.txt"]}

[tool.setuptools.packages.find]
include = ["proyectorobot*"]

[tool.setuptools.package-data]
proyectorobot = ["simulation/assets/*.xml"]
